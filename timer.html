<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fokus-Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<style>
/* Layout: one quiet column — mode select, large remaining time with start→end range, a bar that fills up, then controls. Matches the Tagesplan card. */
:root {
  --bg: #ffffff; --fg: #1d1d1b; --muted: #8a8a86; --line: #e6e6e3; --track: #ececea;
  --bar: #1d1d1b; --btn: #ffffff; --btn-hover: #f5f5f3; --done: #2f7d4f;
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #191918; --fg: #ececea; --muted: #8f8f8a; --line: #2f2f2d; --track: #2a2a28;
          --bar: #ececea; --btn: #1f1f1e; --btn-hover: #2a2a28; --done: #7fd19e; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); padding: 8px max(10px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 300px; display: flex; flex-direction: column; gap: 9px; }
.label { font-size: 11px; color: var(--muted); margin-bottom: -5px; }
.select { position: relative; }
select {
  width: 100%; max-width: 160px; appearance: none; -webkit-appearance: none;
  font: inherit; font-size: 12px; color: var(--fg); background: var(--btn);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 24px 5px 9px; cursor: pointer;
}
.select::after { content: "⌄"; position: absolute; left: min(100%, 160px); margin-left: -18px; top: 2px; color: var(--muted); font-size: 12px; pointer-events: none; }
.row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-size: clamp(28px, 8vw, 40px); font-weight: 300; letter-spacing: -0.04em; line-height: 0.95; font-variant-numeric: tabular-nums; }
.big.done { color: var(--done); }
.range { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-bottom: 3px; }
.track { height: 4px; background: var(--track); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0%; background: var(--bar); border-radius: 99px; transition: width .4s linear; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--btn);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
button:hover { background: var(--btn-hover); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.ico { width: 10px; height: 10px; display: inline-block; }
.stat { font-size: 11px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">Timer</div>
  <div class="select">
    <select id="mode" aria-label="Timer-Art">
      <option value="25">Pomodoro Timer</option>
      <option value="5">Kurze Pause</option>
      <option value="15">Lange Pause</option>
      <option value="50">Deep Work</option>
    </select>
  </div>

  <div class="row">
    <div class="big" id="big">25min</div>
    <div class="range" id="range"></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>

  <div class="btns">
    <button id="minus">- 5 min</button>
    <button id="plus">+ 5 min</button>
  </div>
  <div class="btns">
    <button id="stop"><svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="11" height="11" rx="1.5"/></svg><span>Session beenden</span></button>
    <button id="toggle"><svg class="ico" id="toggleIco" viewBox="0 0 14 14" fill="currentColor"></svg><span id="toggleTxt">Starten</span></button>
  </div>
  <div class="stat" id="stat"></div>
</div>

<script>
const KEY = "fokus-timer-v1";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const PLAY = '<path d="M3 1.8v10.4L12 7z"/>';
const PAUSE = '<rect x="2.5" y="1.5" width="3" height="11" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="8.5" y="1.5" width="3" height="11" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/>';

// state: duration (ms), status idle|running|paused|done, endAt (running), remaining (paused), startedAt
let s = { mode: "25", duration: 25 * 60000, status: "idle", endAt: 0, remaining: 25 * 60000, startedAt: 0, doneToday: 0, day: "" };
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) s = Object.assign(s, saved); } catch (e) {}
const today = new Date().toDateString();
if (s.day !== today) { s.day = today; s.doneToday = 0; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

function remaining() {
  if (s.status === "running") return Math.max(0, s.endAt - Date.now());
  if (s.status === "done") return 0;
  return s.remaining;
}

function fmt(ms) {
  if (ms >= 60000) return `${Math.ceil(ms / 60000)}min`;
  return `${Math.ceil(ms / 1000)}s`;
}

let audio;
function chime() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach((t, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = [660, 880, 990][i]; o.type = "sine";
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.3);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.32);
    });
  } catch (e) {}
}

function render() {
  if (s.status === "running" && remaining() === 0) {
    s.status = "done"; if (s.mode === "25" || s.mode === "50") s.doneToday++; save(); chime();
    document.title = "Fertig · Fokus-Timer";
  }
  const r = remaining();
  const big = $("big");
  big.textContent = s.status === "done" ? "Fertig" : fmt(r);
  big.classList.toggle("done", s.status === "done");
  const pct = s.duration ? (1 - r / s.duration) * 100 : 0;
  $("fill").style.width = Math.min(100, Math.max(0, pct)) + "%";

  let range = "";
  if (s.status === "running") range = `${hm(s.startedAt)} → ${hm(s.endAt)}`;
  else if (s.status === "paused") range = `pausiert · noch ${fmt(r)}`;
  else if (s.status === "idle") range = `${hm(Date.now())} → ${hm(Date.now() + s.duration)}`;
  $("range").textContent = range;

  const running = s.status === "running";
  $("toggleIco").innerHTML = running ? PAUSE : PLAY;
  $("toggleTxt").textContent = running ? "Pausieren" : s.status === "paused" ? "Fortsetzen" : s.status === "done" ? "Neu starten" : "Starten";
  $("stop").disabled = s.status === "idle";
  $("minus").disabled = r <= 5 * 60000 && s.status !== "idle" || (s.status === "idle" && s.duration <= 5 * 60000);
  $("mode").value = s.mode;
  $("stat").textContent = s.doneToday ? `Heute ${s.doneToday} Fokus-Session${s.doneToday === 1 ? "" : "s"} geschafft` : "";
  if (running) document.title = `${fmt(r)} · Fokus-Timer`;
}

function reset(minutes) {
  s.duration = minutes * 60000; s.remaining = s.duration; s.status = "idle"; s.endAt = 0; s.startedAt = 0;
  document.title = "Fokus-Timer"; save(); render();
}

$("mode").addEventListener("change", e => { s.mode = e.target.value; reset(Number(s.mode)); });
$("toggle").addEventListener("click", () => {
  if (s.status === "running") { s.remaining = remaining(); s.status = "paused"; }
  else if (s.status === "paused") { s.endAt = Date.now() + s.remaining; s.status = "running"; }
  else { if (s.status === "done") { s.duration = Number(s.mode) * 60000; s.remaining = s.duration; }
         s.startedAt = Date.now(); s.endAt = s.startedAt + s.remaining; s.status = "running";
         try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
  save(); render();
});
$("stop").addEventListener("click", () => reset(Number(s.mode)));
function shift(ms) {
  if (s.status === "running") { s.endAt = Math.max(Date.now() + 60000, s.endAt + ms); s.duration = Math.max(60000, s.duration + ms); }
  else if (s.status === "paused") { s.remaining = Math.max(60000, s.remaining + ms); s.duration = Math.max(60000, s.duration + ms); }
  else if (s.status === "idle") { s.duration = Math.max(5 * 60000, s.duration + ms); s.remaining = s.duration; }
  save(); render();
}
$("minus").addEventListener("click", () => shift(-5 * 60000));
$("plus").addEventListener("click", () => shift(5 * 60000));

render();
setInterval(render, 1000);
</script>
</body>
</html>
